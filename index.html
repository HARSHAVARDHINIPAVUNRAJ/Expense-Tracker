<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

<div class="container">

    <h1>Expense Tracker</h1>

    <!-- NEW FEATURE -->
    <div class="budget-box">
        <h2>Monthly Expense Limit</h2>

        <input
            type="number"
            id="monthlyLimit"
            placeholder="Enter monthly limit"
        >

        <button onclick="setLimit()">Set Limit</button>

        <div class="budget-info">
            <p>Monthly Limit: ₹<span id="limitDisplay">0</span></p>
            <p>Total Expenses: ₹<span id="totalDisplay">0</span></p>
            <p>Remaining Budget: ₹<span id="remainingDisplay">0</span></p>
        </div>

        <p id="warning"></p>
    </div>

    <!-- EXISTING EXPENSE SECTION -->
    <div class="expense-form">

        <input
            type="text"
            id="expenseName"
            placeholder="Expense name"
        >

        <input
            type="number"
            id="expenseAmount"
            placeholder="Amount"
        >

        <button onclick="addExpense()">Add Expense</button>

    </div>

    <h2>Expense History</h2>

    <ul id="expenseList"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
